<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ronaldo - Calculadora Financeira</title>
</head>

<body>
    <h1>Calculadora Financeira</h1>

    <div id="div_calculadoraSilo">
        <h3>Calculadora Área Silo</h3>

        <span>Altura total do silo:</span>
        <input type="text" placeholder="Insira a altura total" id="ipt_alturaTotal"> <br>
        <span>Altura medida pelo sensor:</span>
        <input type="text" placeholder="Insira a altura medida" id="ipt_medidaSilo"> <br>
        <span>Raio Cilindro do Silo:</span>
        <input type="text" placeholder="Insira o raio" id="ipt_raioCilindro"> <br>
        
        <button onclick="calcularVolume()">Calcular volume</button>

        <br>

        <span id="span_calculoVolume"></span>
    </div>

    <div id="div_volumeFinanceiro">
        <h3>Calculo Prejuizo M³</h3>
        <span>Preço do m³:</span>
        <input type="text" placeholder="Insira o preço do grão" id="ipt_precom3"> <br>
        <span>Porcentagem de perda:</span>
        <input type="text" placeholder="Insira suposta porcentagem de perda" id="ipt_porcentagemPerdam3"> <br>
        <button onclick="volumeFinanceiro()">Calcular prejuizo</button> <br>

        <span id="span_calculoPrejuizoM3"></span>
    </div>

        </div>

    <div id="div_otimizaçãoEspaço">
        <h3>Calculo Otimização de Espaço</h3>
        <button onclick="otimizaçãoEspaço()">Capacidade recuperada</button> <br>
        <span id="span_capacidadeRecuperada"></span>
    </div>

    <br>
</body>

</html>

<script>
    let volumeTotal = 0
    let volumeOcupado = 0
    let valorMetro3 = 0

    function calcularVolume() {
        let alturaTotal = Number(ipt_alturaTotal.value);
        let alturaMedidaSilo = Number(ipt_medidaSilo.value);
        let raioCilindro = Number(ipt_raioCilindro.value);
        let valorPi = 3.14;

        let alturaOcupada = alturaTotal - alturaMedidaSilo;
        let areaBase = valorPi * (raioCilindro * raioCilindro);
        volumeTotal = areaBase * alturaTotal;
        volumeOcupado = areaBase * alturaOcupada;
        let porcentagemVolumeOcupado = (volumeOcupado / volumeTotal) * 100;

        span_calculoVolume.innerHTML = `Volume total: ${volumeTotal.toFixed(2)} m³.<br> Volume ocupado: ${volumeOcupado.toFixed(2)} m³.<br> O volume ocupado é de ${porcentagemVolumeOcupado.toFixed(2)}%. <br>`   

        if (porcentagemVolumeOcupado < 75) {
        span_calculoVolume.innerHTML += `<span style="color: green;"> Silo com quantidade tranquila, abaixo de 75%. </span>`
        } else if (porcentagemVolumeOcupado < 98) {
            span_calculoVolume.innerHTML += `<span style="color: yellow; background-color: black;"> Silo quase cheio. </span>`
        } else {
            span_calculoVolume.innerHTML += `<span style="color: red;"> Silo lotado. </span>`
            }
    }

    function volumeFinanceiro() {
        valorMetro3 = Number(ipt_precom3.value);
        let porcentagemPrejuizo = Number(ipt_porcentagemPerdam3.value);

        let valorTotalEstocado = valorMetro3 * volumeOcupado;
        let calculoPrejuizo = valorTotalEstocado * (porcentagemPrejuizo / 100)


        span_calculoPrejuizoM3.innerHTML = `Sem o sensor, você perde em média R$${calculoPrejuizo.toFixed(2)} por safra devido a divergências e desperdício.`

    }

    function otimizaçãoEspaço() {
        let diferencaCapacidade = volumeTotal - volumeOcupado;
        let valorCapacidadeNaoUtilizado = valorMetro3 * diferencaCapacidade

        span_capacidadeRecuperada.innerHTML = `Monitoramento em tempo real permitiu aproveitar ${diferencaCapacidade.toFixed(2)}m³ a mais de espaço seguro, gerando um ganho de R$${valorCapacidadeNaoUtilizado.toFixed(2)} sem a necessidade de construir um silo novo.`

    }



</script>

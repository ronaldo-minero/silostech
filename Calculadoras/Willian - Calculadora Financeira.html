<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="csscalculadora.css" />
  </head>
  <body>
    <b>Qual é a altura do silo?:</b>
    <input type="text" id="ipt_alturaSilo" /><br />
    <img
      src="c:\Users\Usuario\Downloads\vista_lateral_altura_silo.png"
      alt=""
      style="width: 40%"
      class="altura"
    />
    <p></p>
    <b>Medida do silo feita pelo sensor:</b>
    <input type="text" id="ipt_sensor" /><br />
    <img
      src="c:\Users\Usuario\Downloads\sensor_medindo_silo_topo.png"
      alt=""
      style="width: 40%"
      class="sensor"
    /><br />
    <b>Qual é a medida do meio até a borda?:</b>
    <input type="dwdwdw" id="ipt_diametro" /><br />
    <img
      src="c:\Users\Usuario\Downloads\vista_de_cima_raio_silo.png"
      alt=""
      style="width: 40%"
      class="altura"
    />
    <button onclick="calcular()">Calcular</button>
    <div id="id_exibir"></div>
  </body>
</html>
<script>
  function calcular() {
    let altura = Number(ipt_alturaSilo.value);
    let sensor = Number(ipt_sensor.value);
    let raio = Number(ipt_diametro.value);

    let alturaOcupada = altura - sensor;
    let volumeTotal = 3.14159 * raio ** 2 * altura;
    let volumeOcupado = 3.14159 * raio ** 2 * alturaOcupada;

    let porcentagem = (volumeOcupado / volumeTotal) * 100;

    id_exibir.innerHTML = `Armazenamento atual é de ${porcentagem.toFixed(1)}% de 100%`;
  }
</script>
